AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Martian access role for one AWS account. Read-only by default; remediation actions
  are added only when EnableRemediation is true. Deploy to many accounts at once with
  CloudFormation StackSets (service-managed, targeting an OU).

Parameters:
  ConnectorPrincipalArn:
    Type: String
    Description: >
      IAM role the Martian connector runs as (its EC2 instance profile, EKS IRSA/Pod
      Identity role or ECS task role), usually in your tooling account.
    AllowedPattern: "^arn:aws[a-z-]*:iam::\\d{12}:role/.+$"
  ExternalId:
    Type: String
    Description: Shown in Martian under Integrations → AWS (martian-<organization id>).
    AllowedPattern: "^martian-[0-9a-f-]{36}$"
  EnableRemediation:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: Allow approved changes (stop instances, delete unattached volumes, ...).
  RoleName:
    Type: String
    Default: MartianAccess

Conditions:
  Remediation: !Equals [!Ref EnableRemediation, "true"]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref ConnectorPrincipalArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "sts:ExternalId": !Ref ExternalId }
      Policies:
        - PolicyName: martian-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Inventory
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeImages
                  - ec2:DescribeNatGateways
                  - ec2:DescribeRegions
                  - rds:DescribeDBInstances
                  - autoscaling:DescribeAutoScalingGroups
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - tag:GetResources
                Resource: "*"
              - Sid: Utilization
                Effect: Allow
                Action: [cloudwatch:GetMetricData, cloudwatch:ListMetrics]
                Resource: "*"
              - Sid: Cost
                Effect: Allow
                Action: [ce:GetCostAndUsage]
                Resource: "*"

  RemediationPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: Remediation
    Properties:
      RoleName: !Ref Role
      PolicyName: martian-remediate
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Every action Martian takes is reversible or preceded by a snapshot, and runs
          # only after approval in Martian (or auto-approve for low-risk changes).
          - Sid: Compute
            Effect: Allow
            Action: [ec2:StopInstances, ec2:StartInstances]
            Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*
          - Sid: Storage
            Effect: Allow
            Action: [ec2:CreateSnapshot, ec2:DeleteVolume, ec2:DeleteSnapshot, ec2:CreateTags]
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:volume/*
              - !Sub arn:${AWS::Partition}:ec2:*::snapshot/*
          - Sid: Network
            Effect: Allow
            Action: [ec2:DeleteNatGateway, elasticloadbalancing:DeleteLoadBalancer]
            Resource: "*"
          - Sid: Scaling
            Effect: Allow
            Action: [autoscaling:SetDesiredCapacity]
            Resource: "*"
          - Sid: Databases
            Effect: Allow
            Action: [rds:ModifyDBInstance]
            Resource: !Sub arn:${AWS::Partition}:rds:*:${AWS::AccountId}:db:*
          # Opt out per resource: tag it martian:protect=true.
          - Sid: RespectProtectTag
            Effect: Deny
            Action:
              - ec2:StopInstances
              - ec2:DeleteVolume
              - ec2:DeleteSnapshot
              - rds:ModifyDBInstance
              - autoscaling:SetDesiredCapacity
            Resource: "*"
            Condition:
              StringEquals: { "aws:ResourceTag/martian:protect": "true" }

Outputs:
  RoleArn:
    Description: Paste into Martian → Integrations → AWS → Accounts.
    Value: !GetAtt Role.Arn
