{{- if .Values.networkPolicy.enabled }}
# No inbound traffic except kubelet probes; outbound to DNS, HTTPS (gateway + cloud APIs)
# and anything listed in networkPolicy.extraEgress (vCenter, SSH hosts).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "martian-connector.fullname" . }}
  labels: {{- include "martian-connector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "martian-connector.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
