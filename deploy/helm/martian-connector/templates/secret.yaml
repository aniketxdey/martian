{{- if not .Values.existingSecret }}
{{- if not .Values.token }}{{ fail "set token or existingSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "martian-connector.fullname" . }}
  labels: {{- include "martian-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARTIAN_CONNECTOR_TOKEN: {{ .Values.token | quote }}
{{- end }}
