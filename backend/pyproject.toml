[project]
name = "martian"
version = "0.1.0"
description = "Martian control plane: API, agents, scans and workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "structlog>=24.4",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "langchain-mcp-adapters>=0.2",
  "mcp>=1.20",
  "email-validator>=2.2",
]

[project.optional-dependencies]
kms = ["boto3>=1.35"]
forecast = ["torch>=2.4", "numpy>=1.26"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "asgi-lifespan>=2.1"]

[project.scripts]
martian-api = "martian.api.main:run"
martian-worker = "martian.jobs.worker:run"
martian-forecast = "martian.forecast.server:run"
martian-seed = "martian.seed:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["martian"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
