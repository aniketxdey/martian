# Martian on one host: the full control plane plus a sandbox connector.
#
#   cp .env.example .env    # set secrets; ANTHROPIC_API_KEY is optional
#   docker compose up --build
#   open http://localhost:8080   (admin@company.com / admin123 when MARTIAN_SEED_DEMO=true)
#
# To connect real infrastructure, create a connector in Integrations and run the
# install command it prints inside the customer network, then drop `connector` below.

x-control-plane-env: &cp-env
  MARTIAN_ENV: ${MARTIAN_ENV:-development}
  MARTIAN_DATABASE_URL: postgresql+psycopg://martian_app:${MARTIAN_APP_DB_PASSWORD:-martian}@postgres:5432/martian
  MARTIAN_WEB_ORIGIN: ${MARTIAN_WEB_ORIGIN:-http://localhost:8080}
  MARTIAN_API_PUBLIC_URL: ${MARTIAN_API_PUBLIC_URL:-http://localhost:8080/api}
  MARTIAN_SESSION_SECRET: ${MARTIAN_SESSION_SECRET:-dev-insecure-session-secret-change-me}
  MARTIAN_COOKIE_SECURE: ${MARTIAN_COOKIE_SECURE:-false}
  MARTIAN_ENCRYPTION_KEY: ${MARTIAN_ENCRYPTION_KEY:-}
  MARTIAN_KMS_KEY_ID: ${MARTIAN_KMS_KEY_ID:-}
  MARTIAN_INTERNAL_TOKEN: ${MARTIAN_INTERNAL_TOKEN:-dev-internal-token-change-me}
  MARTIAN_GATEWAY_URL: http://gateway:8787
  MARTIAN_FORECAST_URL: http://forecast:8790/mcp
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  MARTIAN_ANTHROPIC_MODEL: ${MARTIAN_ANTHROPIC_MODEL:-claude-sonnet-5-5}
  MARTIAN_WORKOS_API_KEY: ${MARTIAN_WORKOS_API_KEY:-}
  MARTIAN_WORKOS_CLIENT_ID: ${MARTIAN_WORKOS_CLIENT_ID:-}
  MARTIAN_ALLOW_PRIVATE_EGRESS: ${MARTIAN_ALLOW_PRIVATE_EGRESS:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: martian
      POSTGRES_USER: martian_owner
      POSTGRES_PASSWORD: ${MARTIAN_OWNER_DB_PASSWORD:-martian}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martian_owner -d martian"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ./backend, target: app }
    image: martian-control-plane
    command: ["martian-migrate"]
    environment:
      <<: *cp-env
      MARTIAN_MIGRATION_DATABASE_URL: postgresql+psycopg://martian_owner:${MARTIAN_OWNER_DB_PASSWORD:-martian}@postgres:5432/martian
      MARTIAN_APP_DB_PASSWORD: ${MARTIAN_APP_DB_PASSWORD:-martian}
      MARTIAN_SEED_DEMO: ${MARTIAN_SEED_DEMO:-true}
      MARTIAN_DEMO_CONNECTOR_TOKEN: ${MARTIAN_DEMO_CONNECTOR_TOKEN:-mct_demo_sandbox_connector_token_do_not_use_in_production}
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    image: martian-control-plane
    command: ["martian-api"]
    environment: *cp-env
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  worker:
    image: martian-control-plane
    command: ["martian-worker"]
    environment:
      <<: *cp-env
      MARTIAN_WORKER_CONCURRENCY: ${MARTIAN_WORKER_CONCURRENCY:-4}
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  forecast:
    build: { context: ./backend, target: forecast }
    environment:
      MARTIAN_INTERNAL_TOKEN: ${MARTIAN_INTERNAL_TOKEN:-dev-internal-token-change-me}
    restart: unless-stopped

  gateway:
    build: { context: ./mcp, target: gateway }
    environment:
      PORT: "8787"
      MARTIAN_API_URL: http://api:8000
      MARTIAN_ALLOW_PRIVATE_EGRESS: ${MARTIAN_ALLOW_PRIVATE_EGRESS:-false}
      MARTIAN_INTERNAL_TOKEN: ${MARTIAN_INTERNAL_TOKEN:-dev-internal-token-change-me}
    depends_on: [api]
    restart: unless-stopped

  # Sandbox connector: deterministic infrastructure behind the real tool contracts.
  connector:
    build: { context: ./mcp, target: connector }
    environment:
      MARTIAN_GATEWAY_URL: ws://gateway:8787/connect
      MARTIAN_CONNECTOR_TOKEN: ${MARTIAN_DEMO_CONNECTOR_TOKEN:-mct_demo_sandbox_connector_token_do_not_use_in_production}
      MARTIAN_SANDBOX: "true"
    depends_on: [gateway]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: Dockerfile.web, args: { VITE_API_URL: /api } }
    ports: ["${MARTIAN_HTTP_PORT:-8080}:8080"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
